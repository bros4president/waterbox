name: Publish Waterbox packages

on:
  push:
    tags: [packages-v0.1.0-alpha.2]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'bros4president/waterbox' && github.ref == 'refs/tags/packages-v0.1.0-alpha.2'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - name: Retain current Node 24 binary
        run: echo "NODE_24_CURRENT_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Retain minimum Node 24 binary
        run: echo "NODE_24_15_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2
      - name: Install test runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Verify clean tag and version
        run: |
          test "$(git tag --points-at HEAD)" = "packages-v0.1.0-alpha.2"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          node <<'NODE'
          const version = "0.1.0-alpha.2";
          const manifests = [
            require("./packages/sandbox-contracts/package.json"),
            require("./packages/sandbox-core/package.json"),
            require("./packages/sandbox-api/package.json"),
            require("./packages/sandbox-provider-box/package.json"),
          ];
          if (manifests.some(manifest => manifest.version !== version)) process.exit(1);
          for (const manifest of manifests) {
            for (const [name, dependency] of Object.entries(manifest.dependencies ?? {})) {
              if (name.startsWith("@waterbox/") && dependency !== version) process.exit(1);
            }
          }
          const mcp = require("./packages/mcp/package.json");
          if (mcp.name !== "waterbox" || mcp.version !== version) process.exit(1);
          NODE
      - run: bun install --frozen-lockfile
      - name: Build and certify release inputs
        env:
          WATERBOX_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/waterbox-release
        run: bun run check:release
      - name: Pack exact scoped artifacts
        run: |
          release_dir="${RUNNER_TEMP}/waterbox-release"
          npm pack --ignore-scripts --pack-destination "$release_dir" packages/sandbox-contracts
          npm pack --ignore-scripts --pack-destination "$release_dir" packages/sandbox-core
          npm pack --ignore-scripts --pack-destination "$release_dir" packages/sandbox-api
          npm pack --ignore-scripts --pack-destination "$release_dir" packages/sandbox-provider-box
          cd "$release_dir"
          sha256sum \
            waterbox-contracts-0.1.0-alpha.2.tgz \
            waterbox-core-0.1.0-alpha.2.tgz \
            waterbox-api-0.1.0-alpha.2.tgz \
            waterbox-provider-box-0.1.0-alpha.2.tgz \
            > waterbox-packages-0.1.0-alpha.2.sha256
      - name: Recheck clean tracked inputs
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waterbox-packages-0.1.0-alpha.2-release-evidence
          path: ${{ runner.temp }}/waterbox-release/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish or verify retained tarballs
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          release_dir="${RUNNER_TEMP}/waterbox-release"
          registry_dir="${RUNNER_TEMP}/waterbox-registry"
          mkdir "$registry_dir"
          cd "$release_dir"
          sha256sum --check waterbox-packages-0.1.0-alpha.2.sha256

          packages=(
            "@waterbox/contracts|waterbox-contracts-0.1.0-alpha.2.tgz"
            "@waterbox/core|waterbox-core-0.1.0-alpha.2.tgz"
            "@waterbox/api|waterbox-api-0.1.0-alpha.2.tgz"
            "@waterbox/provider-box|waterbox-provider-box-0.1.0-alpha.2.tgz"
          )

          package_exists() {
            local package="$1" output
            if output=$(npm view "${package}@0.1.0-alpha.2" version 2>&1); then
              test "$output" = "0.1.0-alpha.2"
              return 0
            fi
            if grep -q "E404" <<<"$output"; then return 1; fi
            printf '%s\n' "$output" >&2
            return 2
          }

          verify_registry_bytes() {
            local package="$1" tarball="$2"
            rm -f "${registry_dir}/${tarball}"
            npm pack "${package}@0.1.0-alpha.2" --pack-destination "$registry_dir" --silent
            cmp "${release_dir}/${tarball}" "${registry_dir}/${tarball}"
          }

          for entry in "${packages[@]}"; do
            IFS='|' read -r package tarball <<<"$entry"
            if package_exists "$package"; then
              verify_registry_bytes "$package" "$tarball"
            else
              status=$?
              test "$status" = 1
            fi
          done

          for entry in "${packages[@]}"; do
            IFS='|' read -r package tarball <<<"$entry"
            if package_exists "$package"; then
              verify_registry_bytes "$package" "$tarball"
            else
              status=$?
              test "$status" = 1
              npm publish "${release_dir}/${tarball}" --provenance --access public --tag next
            fi
          done

          for entry in "${packages[@]}"; do
            IFS='|' read -r package tarball <<<"$entry"
            test "$(npm view "${package}@0.1.0-alpha.2" version)" = "0.1.0-alpha.2"
            test "$(npm view "${package}@next" version)" = "0.1.0-alpha.2"
            test "$(npm view "${package}@latest" version)" = "0.1.0-alpha.1"
            verify_registry_bytes "$package" "$tarball"
          done
          test "$(npm view waterbox@latest version)" = "0.1.0-alpha.2"
