name: Publish waterbox

on:
  push:
    tags: [v0.1.0]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'bros4president/waterbox' && github.ref == 'refs/tags/v0.1.0'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - name: Retain current Node 24 binary
        run: echo "NODE_24_CURRENT_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Retain minimum Node 24 binary
        run: echo "NODE_24_15_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2
      - name: Install test runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Verify clean tag and version
        run: |
          test "$(git tag --points-at HEAD)" = "v0.1.0"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          node -e 'const p=require("./packages/mcp/package.json"); if (p.name !== "waterbox" || p.version !== process.env.GITHUB_REF_NAME.slice(1)) process.exit(1)'
      - run: bun install --frozen-lockfile
      - name: Build and certify exact artifact
        env:
          WATERBOX_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/waterbox-release
        run: bun run check:release
      - name: Recheck clean tracked inputs
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waterbox-0.1.0-release-evidence
          path: ${{ runner.temp }}/waterbox-release/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish retained tarball with provenance
        run: |
          npm install --global npm@11.5.1
          cd "${RUNNER_TEMP}/waterbox-release"
          sha256sum --check waterbox-0.1.0.sha256
          npm publish "${RUNNER_TEMP}/waterbox-release/waterbox-0.1.0.tgz" --provenance --access public
