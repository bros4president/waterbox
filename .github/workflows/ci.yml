name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24.15.0, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Select artifact Node binary
        run: |
          if [ "${{ matrix.node }}" = "24.15.0" ]; then
            echo "NODE_24_15_BIN=$(command -v node)" >> "$GITHUB_ENV"
          else
            echo "NODE_24_CURRENT_BIN=$(command -v node)" >> "$GITHUB_ENV"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2
      - name: Install test runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run check:release
      - run: git diff --check
